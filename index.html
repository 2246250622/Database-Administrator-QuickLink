<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DBA Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="IMG_3755.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root, [data-theme="light"] {
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #7c3aed;
            --input: #ffffff;
        }
        [data-theme="dark"] {
            --bg: #0f1117;
            --card: #181b23;
            --border: #2a2e3a;
            --text: #e8eaed;
            --muted: #8b93a7;
            --accent: #a78bfa;
            --input: #0f1117;
        }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            transition: background 0.2s, color 0.2s;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .logo {
            width: 100%;
            max-width: 120px;
            height: auto;
            margin: 0 auto 16px;
            display: block;
        }
        h1 { font-size: 1.4rem; font-weight: 600; text-align: center; margin-bottom: 6px; }
        .subtitle { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 28px; }
        .form-label { color: var(--muted); font-size: 0.8rem; font-weight: 500; margin-bottom: 6px; }
        .form-control {
            background: var(--input);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 10px;
            padding: 12px 14px;
        }
        .form-control:focus {
            background: var(--input);
            border-color: var(--accent);
            color: var(--text);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
        }
        .btn-login {
            background: var(--accent);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            margin-top: 8px;
            color: #fff;
        }
        .btn-login:hover { filter: brightness(1.05); }
        .links { text-align: center; margin-top: 20px; font-size: 0.85rem; }
        .links a { color: var(--accent); text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .form-check-input:checked { background-color: var(--accent); border-color: var(--accent); }
        #errorMsg, #successMsg { font-size: 0.85rem; text-align: center; margin-top: 12px; }
    </style>
</head>
<body>

<div class="login-card">
    <img src="ctg.jpg" alt="CTG Logo" class="logo">
    <h1 data-i18n="brand">DBA Portal</h1>
    <p class="subtitle" id="formTitle" data-i18n="login.subtitle">Sign in to continue</p>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label" data-i18n="login.email">Email</label>
            <input type="email" class="form-control" id="email" placeholder="you@company.com" required>
        </div>
        <div class="mb-3" id="passwordGroup">
            <label class="form-label" data-i18n="login.password">Password</label>
            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" checked>
            <label class="form-check-label" for="rememberMe" style="color: var(--muted); font-size: 0.85rem;" data-i18n="login.remember">Remember me</label>
        </div>
        <button type="submit" class="btn btn-login" id="submitBtn" data-i18n="login.signin">Sign in</button>
    </form>

    <div class="links">
        <a href="#" id="toggleSignup" data-i18n="login.create">Create account</a>
        <span style="color: var(--border); margin: 0 8px;">·</span>
        <a href="#" id="forgotPassword" data-i18n="login.forgot">Forgot password</a>
    </div>

    <p class="text-danger" id="errorMsg" style="display:none;"></p>
    <p class="text-success" id="successMsg" style="display:none;"></p>
</div>

<script>
const SUPABASE_URL = "https://fyrzooerrrmkwrbjapoa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_YvzQbyBUN4ex7WLgLV5HFA_n2ctfmu0";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isSignupMode = false;
const form = document.getElementById("loginForm");
const formTitle = document.getElementById("formTitle");
const submitBtn = document.getElementById("submitBtn");
const toggleSignup = document.getElementById("toggleSignup");
const forgotPassword = document.getElementById("forgotPassword");
const errorMsg = document.getElementById("errorMsg");
const successMsg = document.getElementById("successMsg");

function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = "block";
    successMsg.style.display = "none";
    setTimeout(() => errorMsg.style.display = "none", 5000);
}
function showSuccess(msg) {
    successMsg.textContent = msg;
    successMsg.style.display = "block";
    errorMsg.style.display = "none";
    setTimeout(() => successMsg.style.display = "none", 5000);
}

toggleSignup.addEventListener("click", function(e) {
    e.preventDefault();
    isSignupMode = !isSignupMode;
    if (isSignupMode) {
        formTitle.textContent = document.documentElement.lang.startsWith("zh") ? "申請帳號" : "Request access";
        submitBtn.textContent = document.documentElement.lang.startsWith("zh") ? "送出申請" : "Submit request";
        toggleSignup.textContent = document.documentElement.lang.startsWith("zh") ? "返回登入" : "Back to sign in";
    } else {
        formTitle.textContent = document.documentElement.lang.startsWith("zh") ? "請登入以繼續" : "Sign in to continue";
        submitBtn.textContent = document.documentElement.lang.startsWith("zh") ? "登入" : "Sign in";
        toggleSignup.textContent = document.documentElement.lang.startsWith("zh") ? "建立帳號" : "Create account";
    }
});

forgotPassword.addEventListener("click", async function(e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    if (!email) return showError(document.documentElement.lang.startsWith("zh") ? "請先輸入電郵" : "Please enter your email first");
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/index.html"
    });
    if (error) showError(error.message);
    else showSuccess(document.documentElement.lang.startsWith("zh") ? "重設密碼郵件已寄出" : "Password reset email sent.");
});

form.addEventListener("submit", async function(e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (isSignupMode) {
        const { error } = await supabaseClient.from('pending_user').insert({ email, password, status: 'pending' });
        if (error) showError(error.message);
        else {
            showSuccess(document.documentElement.lang.startsWith("zh") ? "申請已送出，請等待批准" : "Request submitted. Waiting for approval.");
            setTimeout(() => {
                isSignupMode = false;
                formTitle.textContent = document.documentElement.lang.startsWith("zh") ? "請登入以繼續" : "Sign in to continue";
                submitBtn.textContent = document.documentElement.lang.startsWith("zh") ? "登入" : "Sign in";
                toggleSignup.textContent = document.documentElement.lang.startsWith("zh") ? "建立帳號" : "Create account";
                document.getElementById("password").value = "";
            }, 2500);
        }
    } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) showError(error.message);
        else {
            const remember = document.getElementById("rememberMe").checked;
            if (remember) {
                localStorage.setItem("savedEmail", email);
                localStorage.setItem("savedPassword", password);
            } else {
                localStorage.removeItem("savedEmail");
                localStorage.removeItem("savedPassword");
            }
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("lastActivity", Date.now().toString());
            window.location.href = "home.html";
        }
    }
});

supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) {
        localStorage.setItem("isLoggedIn", "true");
        window.location.href = "home.html";
    }
});

window.addEventListener('DOMContentLoaded', () => {
    const savedEmail = localStorage.getItem('savedEmail');
    const savedPassword = localStorage.getItem('savedPassword');
    if (savedEmail) {
        document.getElementById('email').value = savedEmail;
        document.getElementById('rememberMe').checked = true;
    }
    if (savedPassword) document.getElementById('password').value = savedPassword;
});
</script>
</body>
</html>
