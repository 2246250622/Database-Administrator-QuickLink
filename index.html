<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - DBA Bookmarks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="IMG_3755.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #f8f9fa; }
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .btn-custom {
            background-color: #D0A2F7;
            border-color: #D0A2F7;
            color: white;
        }
        .btn-custom:hover { background-color: #C08AE0; }
        .extra-links { font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="login-container">
    <h3 class="text-center mb-4">Database Administrator</h3>
    <p class="text-center text-muted mb-4" id="formTitle">Please enter your credentials to log in</p>
    
    <form id="loginForm">
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Enter email" required>
        </div>
        <div class="mb-3" id="passwordGroup">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-custom w-100" id="submitBtn">Login</button>
    </form>

    <div class="text-center mt-3 extra-links">
        <a href="#" id="toggleSignup" class="text-decoration-none">Create Account</a>
        <span class="mx-2 text-muted">|</span>
        <a href="#" id="forgotPassword" class="text-decoration-none">Forgot Password</a>
    </div>

    <p class="text-center mt-3 text-danger" id="errorMsg" style="display:none;"></p>
    <p class="text-center mt-3 text-success" id="successMsg" style="display:none;"></p>
</div>

<script>
const SUPABASE_URL = "https://fyrzooerrrmkwrbjapoa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_YvzQbyBUN4ex7WLgLV5HFA_n2ctfmu0";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let isSignupMode = false;

const form = document.getElementById("loginForm");
const formTitle = document.getElementById("formTitle");
const submitBtn = document.getElementById("submitBtn");
const passwordGroup = document.getElementById("passwordGroup");
const toggleSignup = document.getElementById("toggleSignup");
const forgotPassword = document.getElementById("forgotPassword");
const errorMsg = document.getElementById("errorMsg");
const successMsg = document.getElementById("successMsg");

function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = "block";
    successMsg.style.display = "none";
    setTimeout(() => errorMsg.style.display = "none", 5000);
}

function showSuccess(msg) {
    successMsg.textContent = msg;
    successMsg.style.display = "block";
    errorMsg.style.display = "none";
    setTimeout(() => successMsg.style.display = "none", 5000);
}

// 切換 Login / Signup
toggleSignup.addEventListener("click", function(e) {
    e.preventDefault();
    isSignupMode = !isSignupMode;
    if (isSignupMode) {
        formTitle.textContent = "Create a new account";
        submitBtn.textContent = "Submit Request";
        toggleSignup.textContent = "Already have an account? Login";
    } else {
        formTitle.textContent = "Please enter your credentials to log in";
        submitBtn.textContent = "Login";
        toggleSignup.textContent = "Create Account";
    }
});

// Forgot Password
forgotPassword.addEventListener("click", async function(e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    if (!email) {
        showError("Please enter your email first");
        return;
    }
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/index.html"
    });
    if (error) {
        showError(error.message);
    } else {
        showSuccess("Password reset email sent. Please check your inbox.");
    }
});

// Login / Signup
form.addEventListener("submit", async function(e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (isSignupMode) {
        // 寫入 pending_users，不直接建立帳號
        const { error } = await supabaseClient
            .from('pending_user')
            .insert({ email, password, status: 'pending' });

        if (error) {
            showError(error.message);
        } else {
            showSuccess("申請已送出，請等待管理員批准。");
            // 自動切回登入模式
            setTimeout(() => {
                isSignupMode = false;
                formTitle.textContent = "Please enter your credentials to log in";
                submitBtn.textContent = "Login";
                toggleSignup.textContent = "Create Account";
                document.getElementById("password").value = "";
            }, 2500);
        }
    } else {
        // Login
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
            showError(error.message);
        } else {
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("lastActivity", Date.now().toString());
            window.location.href = "home.html";
        }
    }
});

// 已登入就跳轉
supabaseClient.auth.getSession().then(({ data }) => {
    if (data.session) {
        localStorage.setItem("isLoggedIn", "true");
        window.location.href = "home.html";
    }
});
</script>
</body>
</html>
