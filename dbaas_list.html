<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="IMG_3755.jpg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #7c3aed;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .page-header { margin-bottom: 8px; }
        .page-header h1 { font-size: 1.5rem; font-weight: 600; margin: 0; }
        .page-header p { color: var(--muted); font-size: 0.85rem; margin: 4px 0 0; }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
        .toolbar .form-control, .toolbar .form-select {
            border-radius: 8px;
            border-color: var(--border);
            font-size: 0.85rem;
        }
        .toolbar .form-control:focus, .toolbar .form-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }
        .server-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-left: 3px solid #c4b5fd;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 8px;
            transition: all 0.12s;
        }
        .server-item:hover { border-color: #a78bfa; background: #faf5ff; }
        .badge-soft { font-size: 0.7rem; padding: 2px 7px; border-radius: 5px; font-weight: 500; }
        .stats { color: var(--muted); font-size: 0.85rem; margin-bottom: 8px; }
    </style>
</head>
<body>

<div id="navbar-placeholder"></div>
<script src="./assets/js/navbar.js"></script>

<div class="container py-4">
    <div class="page-header">
        <h1>Server List</h1>
        <p>Auto-loaded from GCIS DBaaS Summary2.xls</p>
    </div>

    <div class="toolbar">
        <input type="text" id="searchInput" class="form-control form-control-sm" style="max-width:240px" placeholder="Search VM / IP...">
        <select id="gcisFilter" class="form-select form-select-sm" style="max-width:160px"><option value="">All GCISID</option></select>
        <select id="groupFilter" class="form-select form-select-sm" style="max-width:150px"><option value="">All Group</option></select>
        <select id="dbFilter" class="form-select form-select-sm" style="max-width:160px"><option value="">All DB Name</option></select>
        <select id="siteFilter" class="form-select form-select-sm" style="max-width:110px">
            <option value="">All Site</option>
            <option value="P1">P1</option>
            <option value="P2">P2</option>
            <option value="T1">T1</option>
            <option value="T2">T2</option>
        </select>
        <select id="typeFilter" class="form-select form-select-sm" style="max-width:140px">
            <option value="">All Type</option>
            <option value="Active-Active">Active-Active</option>
            <option value="Active-Passive">Active-Passive</option>
        </select>
        <select id="statusFilter" class="form-select form-select-sm" style="max-width:130px">
            <option value="InUse" selected>InUse</option>
            <option value="Decommission">Decommission</option>
            <option value="">All Status</option>
        </select>
    </div>

    <div id="stats" class="stats">Loading...</div>
    <div id="serverList"></div>
</div>

<script src="assets/dist/js/bootstrap.bundle.min.js"></script>
<script>
let allRows = [];
const GROUP_MAP = {
    'GPA': 'Group 1', 'GPB': 'Group 2', 'GPC': 'Group 3', 'GPD': 'Group 4',
    'GPE': 'Group 5', 'GPF': 'Group 6', 'GPG': 'Group 7', 'GPH': 'Group 8'
};

async function autoLoad() {
    try {
        const res = await fetch('./GCIS DBaaS Summary2.xls');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const buf = await res.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        allRows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        populateDropdowns();
        document.getElementById('stats').textContent = `Loaded ${allRows.length} rows`;
        renderList();
        const params = new URLSearchParams(location.search);
        const hostParam = params.get('host');
        if (hostParam) {
            document.getElementById('searchInput').value = hostParam;
            renderList();
        }
    } catch (e) {
        document.getElementById('stats').textContent = 'Failed to load GCIS DBaaS Summary2.xls';
        console.error(e);
    }
}

function uniqueSorted(arr) {
    return [...new Set(arr.filter(Boolean))].sort();
}

function populateDropdowns() {
    const gcis = uniqueSorted(allRows.map(r => r.GCISID));
    const dbs = uniqueSorted(allRows.map(r => r.CloudServiceName));
    const groupOptions = Object.entries(GROUP_MAP).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
    document.getElementById('groupFilter').innerHTML = `<option value="">All Group</option>` + groupOptions;
    fillSelect('gcisFilter', gcis, 'All GCISID');
    fillSelect('dbFilter', dbs, 'All DB Name');
}

function fillSelect(id, items, defaultText) {
    document.getElementById(id).innerHTML = `<option value="">${defaultText}</option>` +
        items.map(v => `<option value="${v}">${v}</option>`).join('');
}

function renderList() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const gcis = document.getElementById('gcisFilter').value;
    const group = document.getElementById('groupFilter').value;
    const db = document.getElementById('dbFilter').value;
    const site = document.getElementById('siteFilter').value;
    const type = document.getElementById('typeFilter').value;
    const status = document.getElementById('statusFilter').value;

    const filtered = allRows.filter(r => {
        const text = `${r.GCISID} ${r.CloudServiceName} ${r.VMName} ${r['HostIP of VM']} ${r['ServiceIP of VM']} ${r['MgtIP of VM']}`.toLowerCase();
        if (q && !text.includes(q)) return false;
        if (gcis && r.GCISID !== gcis) return false;
        if (group && !(r['NSX-T group'] || '').endsWith(group)) return false;
        if (db && r.CloudServiceName !== db) return false;
        if (site && r.Site !== site) return false;
        if (type && r.DBaaSType !== type) return false;
        if (status && r.DBaaSStatus !== status) return false;
        return true;
    });

    document.getElementById('stats').textContent = `Showing ${filtered.length} / ${allRows.length}`;
    document.getElementById('serverList').innerHTML = filtered.map(r => {
        const nsx = r['NSX-T group'] || '';
        const groupKey = nsx.slice(-3);
        const groupLabel = GROUP_MAP[groupKey] || nsx;
        const statusClass = r.DBaaSStatus === 'InUse' ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning';
        return `
        <div class="server-item">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <strong>${r.GCISID || '-'}</strong>
                    <span class="text-muted"> / ${r.CloudServiceName || '-'}</span>
                    <div class="mt-2">
                        <span class="badge bg-secondary-subtle text-secondary badge-soft">${r.Site || '-'}</span>
                        <span class="badge bg-light text-dark border badge-soft">${r.DBaaSType || '-'}</span>
                        <span class="badge bg-info-subtle text-info badge-soft">${groupLabel}</span>
                        <span class="badge ${statusClass} badge-soft">${r.DBaaSStatus || '-'}</span>
                        <span class="text-muted small ms-1">${r.VMName || ''}</span>
                    </div>
                </div>
                <div class="text-end small text-muted">
                    <div>Host: ${r['HostIP of VM'] || '-'}</div>
                    <div>Service: ${r['ServiceIP of VM'] || '-'}</div>
                    <div>Mgt: ${r['MgtIP of VM'] || '-'}</div>
                </div>
            </div>
        </div>`;
    }).join('') || '<div class="text-muted p-3">No matching servers</div>';
}

['searchInput','gcisFilter','groupFilter','dbFilter','siteFilter','typeFilter','statusFilter'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('input', renderList);
    el.addEventListener('change', renderList);
});

autoLoad();
</script>
</body>
</html>
