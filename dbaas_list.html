<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Server List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="IMG_3755.jpg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background: #f8fafc; }
        .list-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 8px rgba(0,0,0,.04); border: 1px solid #e2e8f0; }
        .server-item { border-left: 4px solid #c4b5fd; }
        .server-item:hover { background: #faf5ff; }
        .badge-site { font-size: 0.75rem; }
        .search-box { max-width: 260px; }
        .filter-select { max-width: 170px; }
    </style>
</head>
<body>

<div id="navbar-placeholder"></div>
<script src="./assets/js/navbar.js"></script>

<div class="container py-4">
    <div class="list-card p-4 mb-4">
        <h4 class="mb-1">Server List</h4>
        <p class="text-muted small mb-3">自動載入 GCIS DBaaS Summary2.xls</p>

        <div class="d-flex gap-2 flex-wrap mb-3">
            <input type="text" id="searchInput" class="form-control form-control-sm search-box" placeholder="搜尋 VM / IP...">

            <select id="gcisFilter" class="form-select form-select-sm filter-select">
                <option value="">全部 GCISID</option>
            </select>

            <select id="groupFilter" class="form-select form-select-sm filter-select">
                <option value="">全部 Group</option>
            </select>

            <select id="dbFilter" class="form-select form-select-sm filter-select">
                <option value="">全部 DB Name</option>
            </select>

            <select id="siteFilter" class="form-select form-select-sm" style="max-width:110px">
                <option value="">全部 Site</option>
                <option value="P1">P1</option>
                <option value="P2">P2</option>
                <option value="T1">T1</option>
                <option value="T2">T2</option>
            </select>

            <select id="typeFilter" class="form-select form-select-sm" style="max-width:150px">
                <option value="">全部 Type</option>
                <option value="Active-Active">Active-Active</option>
                <option value="Active-Passive">Active-Passive</option>
            </select>

            <select id="statusFilter" class="form-select form-select-sm" style="max-width:140px">
                <option value="InUse" selected>InUse</option>
                <option value="Decommission">Decommission</option>
                <option value="">全部 Status</option>
            </select>
        </div>

        <div id="stats" class="small text-muted mb-2">載入中...</div>
        <div id="serverList" class="list-group"></div>
    </div>
</div>

<script src="assets/dist/js/bootstrap.bundle.min.js"></script>

<script>
let allRows = [];

const GROUP_MAP = {
    'GPA': 'Group 1',
    'GPB': 'Group 2',
    'GPC': 'Group 3',
    'GPD': 'Group 4',
    'GPE': 'Group 5',
    'GPF': 'Group 6',
    'GPG': 'Group 7',
    'GPH': 'Group 8'
};

async function autoLoad() {
    try {
        const res = await fetch('./GCIS DBaaS Summary2.xls');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const buf = await res.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        allRows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

        populateDropdowns();
        document.getElementById('stats').textContent = `已自動載入 ${allRows.length} 筆`;
        renderList();
    } catch (e) {
        document.getElementById('stats').textContent = '載入失敗，請確認 GCIS DBaaS Summary2.xls 在根目錄';
        console.error(e);
    }
}

function uniqueSorted(arr) {
    return [...new Set(arr.filter(Boolean))].sort();
}

function populateDropdowns() {
    const gcis = uniqueSorted(allRows.map(r => r.GCISID));
    const dbs = uniqueSorted(allRows.map(r => r.CloudServiceName));

    const groupOptions = Object.entries(GROUP_MAP).map(([key, label]) =>
        `<option value="${key}">${label}</option>`
    ).join('');
    document.getElementById('groupFilter').innerHTML =
        `<option value="">全部 Group</option>` + groupOptions;

    fillSelect('gcisFilter', gcis, '全部 GCISID');
    fillSelect('dbFilter', dbs, '全部 DB Name');
}

function fillSelect(id, items, defaultText) {
    const sel = document.getElementById(id);
    sel.innerHTML = `<option value="">${defaultText}</option>` +
        items.map(v => `<option value="${v}">${v}</option>`).join('');
}

function renderList() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const gcis = document.getElementById('gcisFilter').value;
    const group = document.getElementById('groupFilter').value;
    const db = document.getElementById('dbFilter').value;
    const site = document.getElementById('siteFilter').value;
    const type = document.getElementById('typeFilter').value;
    const status = document.getElementById('statusFilter').value;

    const filtered = allRows.filter(r => {
        const text = `${r.GCISID} ${r.CloudServiceName} ${r.VMName} ${r['HostIP of VM']} ${r['ServiceIP of VM']} ${r['MgtIP of VM']}`.toLowerCase();
        if (q && !text.includes(q)) return false;
        if (gcis && r.GCISID !== gcis) return false;
        if (group && !(r['NSX-T group'] || '').endsWith(group)) return false;
        if (db && r.CloudServiceName !== db) return false;
        if (site && r.Site !== site) return false;
        if (type && r.DBaaSType !== type) return false;
        if (status && r.DBaaSStatus !== status) return false;
        return true;
    });

    document.getElementById('stats').textContent = `顯示 ${filtered.length} 筆 / 總共 ${allRows.length} 筆`;

    const html = filtered.map(r => {
        const nsx = r['NSX-T group'] || '';
        const groupKey = nsx.slice(-3);
        const groupLabel = GROUP_MAP[groupKey] || nsx;

        return `
        <div class="list-group-item server-item">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <strong>${r.GCISID || '-'}</strong>
                    <span class="text-muted"> / ${r.CloudServiceName || '-'}</span>
                    <div class="small mt-1">
                        <span class="badge bg-secondary badge-site">${r.Site || '-'}</span>
                        <span class="badge bg-light text-dark border">${r.DBaaSType || '-'}</span>
                        <span class="badge bg-info text-dark">${groupLabel}</span>
                        <span class="badge ${r.DBaaSStatus === 'InUse' ? 'bg-success' : 'bg-warning text-dark'}">${r.DBaaSStatus || '-'}</span>
                        <span class="text-muted">${r.VMName || ''}</span>
                    </div>
                </div>
                <div class="text-end small">
                    <div>Host: ${r['HostIP of VM'] || '-'}</div>
                    <div>Service: ${r['ServiceIP of VM'] || '-'}</div>
                    <div>Mgt: ${r['MgtIP of VM'] || '-'}</div>
                </div>
            </div>
        </div>`;
    }).join('');

    document.getElementById('serverList').innerHTML = html || '<div class="text-muted p-3">沒有符合的資料</div>';
}

['searchInput', 'gcisFilter', 'groupFilter', 'dbFilter', 'siteFilter', 'typeFilter', 'statusFilter'].forEach(id => {
    document.getElementById(id).addEventListener('input', renderList);
    document.getElementById(id).addEventListener('change', renderList);
});

autoLoad();
</script>
</body>
</html>
