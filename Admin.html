<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #7c3aed;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .page-header { margin-bottom: 16px; }
        .page-header h1 { font-size: 1.5rem; font-weight: 600; margin: 0; }
        .user-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-approved { background: #dcfce7; color: #166534; }
        .badge-banned { background: #fee2e2; color: #991b1b; }
        .badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 5px; font-weight: 500; }
        .btn-soft { font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; }
    </style>
</head>
<body>

<div id="navbar-placeholder"></div>
<script src="./assets/js/navbar.js"></script>

<div class="container py-4" id="mainContent" style="display:none;">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h1>User Management</h1>
        <select id="statusFilter" class="form-select form-select-sm" style="width:160px;">
            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="banned">Banned</option>
        </select>
    </div>
    <div id="loading" class="text-muted">Loading...</div>
    <div id="list"></div>
</div>

<div id="denied" class="container text-center py-5" style="display:none;">
    <h4 class="text-danger">Access Denied</h4>
    <p class="text-muted">Only the owner can access this page.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://fyrzooerrrmkwrbjapoa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_YvzQbyBUN4ex7WLgLV5HFA_n2ctfmu0";
const APPROVE_FUNCTION_URL = "https://fyrzooerrrmkwrbjapoa.supabase.co/functions/v1/approve-user";
const BAN_FUNCTION_URL = "https://fyrzooerrrmkwrbjapoa.supabase.co/functions/v1/ban-user";
const DELETE_FUNCTION_URL = "https://fyrzooerrrmkwrbjapoa.supabase.co/functions/v1/delete-user";
const OWNER_EMAIL = "a23200710104@gmail.com";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function checkOwner() {
    const { data } = await supabaseClient.auth.getSession();
    const email = data?.session?.user?.email;
    if (email === OWNER_EMAIL) {
        document.getElementById('mainContent').style.display = 'block';
        loadUsers();
    } else {
        document.getElementById('denied').style.display = 'block';
    }
}

async function loadUsers() {
    const status = document.getElementById('statusFilter').value;
    let query = supabaseClient.from('pending_user').select('*').order('created_at', { ascending: false });
    if (status) query = query.eq('status', status);
    const { data, error } = await query;
    const listEl = document.getElementById('list');
    const loadingEl = document.getElementById('loading');
    if (error) { loadingEl.textContent = 'Error: ' + error.message; return; }
    loadingEl.style.display = 'none';
    if (!data || data.length === 0) { listEl.innerHTML = '<div class="text-muted">No users found.</div>'; return; }
    listEl.innerHTML = data.map(u => {
        const badgeClass = u.status === 'approved' ? 'badge-approved' : u.status === 'banned' ? 'badge-banned' : 'badge-pending';
        return `
        <div class="user-card">
            <div>
                <strong>${u.email}</strong>
                <span class="badge ${badgeClass} ms-2">${u.status}</span>
                <div class="small text-muted">${new Date(u.created_at).toLocaleString()}</div>
            </div>
            <div class="btn-group btn-group-sm">
                ${u.status === 'pending' ? `<button class="btn btn-outline-primary btn-soft approve-btn" data-email="${u.email}" data-password="${u.password}">Approve</button>` : ''}
                ${u.status !== 'banned' ? `<button class="btn btn-outline-warning btn-soft ban-btn" data-email="${u.email}">Ban</button>` : ''}
                ${u.status === 'banned' ? `<button class="btn btn-outline-secondary btn-soft unban-btn" data-email="${u.email}">Unban</button>` : ''}
                <button class="btn btn-outline-danger btn-soft delete-btn" data-email="${u.email}">Delete</button>
            </div>
        </div>`;
    }).join('');
    bindButtons();
}

function bindButtons() {
    document.querySelectorAll('.approve-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const email = btn.dataset.email;
            const password = btn.dataset.password;
            btn.disabled = true; btn.textContent = 'Approving...';
            try {
                const res = await fetch(APPROVE_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                    body: JSON.stringify({ email, password })
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || JSON.stringify(result));
                loadUsers();
            } catch (e) {
                alert('Approve failed: ' + e.message);
                btn.disabled = false; btn.textContent = 'Approve';
            }
        });
    });
    document.querySelectorAll('.ban-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            if (!confirm(`Ban ${btn.dataset.email}?`)) return;
            const res = await fetch(BAN_FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                body: JSON.stringify({ email: btn.dataset.email, ban: true })
            });
            const result = await res.json();
            if (!res.ok) alert(result.error || 'Ban failed');
            else loadUsers();
        });
    });
    document.querySelectorAll('.unban-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const res = await fetch(BAN_FUNCTION_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                body: JSON.stringify({ email: btn.dataset.email, ban: false })
            });
            const result = await res.json();
            if (!res.ok) alert(result.error || 'Unban failed');
            else loadUsers();
        });
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            if (!confirm(`Permanently delete ${btn.dataset.email}?`)) return;
            btn.disabled = true; btn.textContent = 'Deleting...';
            try {
                const res = await fetch(DELETE_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                    body: JSON.stringify({ email: btn.dataset.email })
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'Delete failed');
                loadUsers();
            } catch (e) {
                alert(e.message);
                btn.disabled = false; btn.textContent = 'Delete';
            }
        });
    });
}

document.getElementById('statusFilter').addEventListener('change', loadUsers);
checkOwner();
</script>
</body>
</html>
