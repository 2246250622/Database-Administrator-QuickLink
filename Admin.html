<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Approve Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; }
        .card { max-width: 800px; margin: 40px auto; }
        .status-pending { color: #d97706; font-weight: 500; }
        .status-approved { color: #16a34a; }
    </style>
</head>
<body>

<div class="container">
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">Pending User Approvals</h5>
            <small class="text-muted">Only you should access this page</small>
        </div>
        <div class="card-body">
            <div id="loading" class="text-muted">Loading...</div>
            <div id="list"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// 替換成你的 Supabase 資訊
const SUPABASE_URL = "https://fyrzooerrrmkwrbjapoa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_YvzQbyBUN4ex7WLgLV5HFA_n2ctfmu0";

// Edge Function 的完整網址（部署後會有）
const APPROVE_FUNCTION_URL = "https://fyrzooerrrmkwrbjapoa.supabase.co/functions/v1/approve-user";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadPending() {
    const { data, error } = await supabase
        .from('pending_user')
        .select('*')
        .eq('status', 'pending')
        .order('created_at', { ascending: false });

    const listEl = document.getElementById('list');
    const loadingEl = document.getElementById('loading');

    if (error) {
        loadingEl.textContent = 'Error: ' + error.message;
        return;
    }

    loadingEl.style.display = 'none';

    if (!data || data.length === 0) {
        listEl.innerHTML = '<div class="text-muted">No pending requests.</div>';
        return;
    }

    listEl.innerHTML = data.map(u => `
        <div class="d-flex justify-content-between align-items-center border-bottom py-3">
            <div>
                <strong>${u.email}</strong>
                <div class="small text-muted">${new Date(u.created_at).toLocaleString()}</div>
            </div>
            <button class="btn btn-sm btn-primary approve-btn" data-email="${u.email}" data-password="${u.password}">
                Approve
            </button>
        </div>
    `).join('');

    // 綁定 Approve 按鈕
    document.querySelectorAll('.approve-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const email = btn.dataset.email;
            const password = btn.dataset.password;
            btn.disabled = true;
            btn.textContent = 'Approving...';

            try {
                const res = await fetch(APPROVE_FUNCTION_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const result = await res.json();
                if (!res.ok) throw new Error(result.error || 'Failed');

                btn.classList.remove('btn-primary');
                btn.classList.add('btn-success');
                btn.textContent = 'Approved';
                // 可選：重新載入列表
                setTimeout(loadPending, 800);
            } catch (e) {
                alert('Approve failed: ' + e.message);
                btn.disabled = false;
                btn.textContent = 'Approve';
            }
        });
    });
}

loadPending();
</script>
</body>
</html>
