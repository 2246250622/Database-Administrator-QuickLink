<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - User Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; }
        .card { max-width: 900px; margin: 40px auto; }
        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-approved { background: #dcfce7; color: #166534; }
        .badge-banned { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div id="navbar-placeholder"></div>
<script src="./assets/js/navbar.js"></script>

<div class="container" id="mainContent" style="display:none;">
    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-0">User Management</h5>
                <small class="text-muted">Manage pending / approved / banned accounts</small>
            </div>
            <select id="statusFilter" class="form-select form-select-sm" style="width: 160px;">
                <option value="">All Status</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="banned">Banned</option>
            </select>
        </div>
        <div class="card-body">
            <div id="loading" class="text-muted">Loading...</div>
            <div id="list"></div>
        </div>
    </div>
</div>

<div id="denied" class="container text-center py-5" style="display:none;">
    <h4 class="text-danger">Access Denied</h4>
    <p class="text-muted">Only the owner can access this page.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://fyrzooerrrmkwrbjapoa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_YvzQbyBUN4ex7WLgLV5HFA_n2ctfmu0";
const APPROVE_FUNCTION_URL = "https://fyrzooerrrmkwrbjapoa.supabase.co/functions/v1/approve-user";

// ← 改成你的 owner email
const OWNER_EMAIL = "a23200710104@gmail.com";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allUsers = [];

async function checkOwner() {
    const { data } = await supabaseClient.auth.getSession();
    const email = data?.session?.user?.email;
    if (email === OWNER_EMAIL) {
        document.getElementById('mainContent').style.display = 'block';
        loadUsers();
    } else {
        document.getElementById('denied').style.display = 'block';
    }
}

async function loadUsers() {
    const status = document.getElementById('statusFilter').value;
    let query = supabaseClient.from('pending_user').select('*').order('created_at', { ascending: false });
    if (status) query = query.eq('status', status);

    const { data, error } = await query;
    const listEl = document.getElementById('list');
    const loadingEl = document.getElementById('loading');

    if (error) {
        loadingEl.textContent = 'Error: ' + error.message;
        return;
    }

    allUsers = data || [];
    loadingEl.style.display = 'none';

    if (allUsers.length === 0) {
        listEl.innerHTML = '<div class="text-muted">No users found.</div>';
        return;
    }

    listEl.innerHTML = allUsers.map(u => {
        const badgeClass = u.status === 'approved' ? 'badge-approved' :
                           u.status === 'banned' ? 'badge-banned' : 'badge-pending';
        return `
        <div class="d-flex justify-content-between align-items-center border-bottom py-3">
            <div>
                <strong>${u.email}</strong>
                <span class="badge ${badgeClass} ms-2">${u.status}</span>
                <div class="small text-muted">${new Date(u.created_at).toLocaleString()}</div>
            </div>
            <div class="btn-group btn-group-sm">
                ${u.status === 'pending' ? `<button class="btn btn-outline-primary approve-btn" data-email="${u.email}" data-password="${u.password}">Approve</button>` : ''}
                ${u.status !== 'banned' ? `<button class="btn btn-outline-warning ban-btn" data-email="${u.email}">Ban</button>` : ''}
                ${u.status === 'banned' ? `<button class="btn btn-outline-secondary unban-btn" data-email="${u.email}">Unban</button>` : ''}
                <button class="btn btn-outline-danger delete-btn" data-email="${u.email}">Delete</button>
            </div>
        </div>`;
    }).join('');

    bindButtons();
}

function bindButtons() {
    // Approve
    document.querySelectorAll('.approve-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const email = btn.dataset.email;
            const password = btn.dataset.password;
            btn.disabled = true;
            btn.textContent = 'Approving...';
            try {
                const res = await fetch(APPROVE_FUNCTION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    },
                    body: JSON.stringify({ email, password })
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.error || JSON.stringify(result));
                loadUsers();
            } catch (e) {
                alert('Approve failed: ' + e.message);
                btn.disabled = false;
                btn.textContent = 'Approve';
            }
        });
    });

    // Ban / Unban
    document.querySelectorAll('.ban-btn, .unban-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            const newStatus = btn.classList.contains('ban-btn') ? 'banned' : 'pending';
            const { error } = await supabaseClient
                .from('pending_user')
                .update({ status: newStatus })
                .eq('email', btn.dataset.email);
            if (error) alert(error.message);
            else loadUsers();
        });
    });

    // Delete
    document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
            if (!confirm(`Delete ${btn.dataset.email} permanently?`)) return;
            const { error } = await supabaseClient
                .from('pending_user')
                .delete()
                .eq('email', btn.dataset.email);
            if (error) alert(error.message);
            else loadUsers();
        });
    });
}

document.getElementById('statusFilter').addEventListener('change', loadUsers);
checkOwner();
</script>
</body>
</html>
