<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GCIS DBaaS Summary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="IMG_3755.jpg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        .btn-outline-custom {
            --bs-btn-color: #343a40;
            --bs-btn-bg: #DCBFFF;
            --bs-btn-border-color: #DCBFFF;
            --bs-btn-hover-color: #343a40;
            --bs-btn-hover-bg: #E5D4FF;
            --bs-btn-hover-border-color: #E5D4FF;
            --bs-btn-active-color: #343a40;
            --bs-btn-active-bg: #E5D4FF;
            --bs-btn-active-border-color: #E5D4FF;
        }

        .summary-page {
            background: #f8fafc;
            min-height: calc(100vh - 80px);
            padding: 32px 0 60px;
        }

        .summary-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.04);
            padding: 28px 32px;
            max-width: 1100px;
            margin: 0 auto;
            border: 1px solid #e2e8f0;
        }

        .summary-card h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 4px;
            text-align: center;
        }

        .summary-card .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .upload-box {
            border: 2px dashed #cbd5e1;
            border-radius: 10px;
            padding: 28px 20px;
            text-align: center;
            background: #f8fafc;
            transition: all 0.2s ease;
            margin-bottom: 24px;
        }

        .upload-box:hover {
            border-color: #c4b5fd;
            background: #faf5ff;
        }

        .upload-hint {
            color: #64748b;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        .summary-page table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 8px;
            overflow: hidden;
            font-size: 0.92rem;
            border: 1px solid #e2e8f0;
        }

        .summary-page th,
        .summary-page td {
            padding: 12px 14px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .summary-page th {
            background: #ede9fe;
            color: #5b21b6;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .summary-page .subheader {
            background: #f5f3ff;
            color: #6d28d9;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .summary-page tbody tr:hover {
            background: #faf5ff;
        }

        .summary-page .total-row {
            background: #f1f5f9;
            color: #1e293b;
            font-weight: 600;
        }

        .summary-page .total-row td {
            border-bottom: none;
        }

        .diff-positive { color: #16a34a; font-weight: 600; }
        .diff-negative { color: #dc2626; font-weight: 600; }
        .diff-zero     { color: #64748b; }
        .diff-none     { color: #94a3b8; }

        .date {
            text-align: right;
            color: #94a3b8;
            font-size: 0.82rem;
            margin-top: 16px;
        }

        .summary-page td:first-child {
            font-weight: 500;
            color: #334155;
        }
    </style>
</head>
<body>

<div id="navbar-placeholder"></div>
<script src="./assets/js/navbar.js"></script>

<div class="summary-page">
    <div class="summary-card">
        <h1>DBaaS Summary</h1>
        <div class="subtitle">上傳 Excel 檔案即可產生統計表（Diff 會跟上一次比較）</div>

        <div class="upload-box">
            <div class="mb-1" style="font-weight: 500; color: #334155;">選擇檔案</div>
            <input type="file" id="fileInput" accept=".xls,.xlsx" class="form-control form-control-sm" style="max-width: 320px; margin: 0 auto;" />
            <div class="upload-hint">支援 .xls / .xlsx</div>
        </div>

        <div id="result"></div>
        <div class="date">Report Date: <span id="dateText">--</span></div>
    </div>
</div>

<script src="assets/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const STORAGE_KEY = 'dbaas_summary_last';

    function formatDiff(current, previous) {
        if (previous === undefined || previous === null) {
            return '<span class="diff-none">—</span>';
        }
        const diff = current - previous;
        if (diff > 0) return `<span class="diff-positive">+${diff}</span>`;
        if (diff < 0) return `<span class="diff-negative">${diff}</span>`;
        return '<span class="diff-zero">0</span>';
    }

    function loadLastSummary() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : null;
        } catch {
            return null;
        }
    }

    function saveCurrentSummary(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });

            const summary = {
                aa: { idsT: new Set(), idsP: new Set(), dbT: 0, dbP: 0 },
                ap: { idsT: new Set(), idsP: new Set(), dbT: 0, dbP: 0 }
            };
            const globalIdsT = new Set();
            const globalIdsP = new Set();

            for (let i = 1; i < rows.length; i++) {
                const r = rows[i];
                if (!r || r.length < 10) continue;

                const gcisID = String(r[0] || "").trim();
                if (!gcisID || gcisID.toUpperCase() === "GCISID") continue;

                const site = String(r[2] || "").trim().toUpperCase();
                const dbaasType = String(r[8] || "").toLowerCase();
                const dbType = String(r[9] || "").trim();

                if (!dbType.includes("MariaDB")) continue;

                const isTest = site.startsWith("T");
                const isProd = site.startsWith("P");
                const isAA = dbaasType.includes("active-active") || dbaasType.includes("active active");

                if (isAA) {
                    if (isTest) { summary.aa.idsT.add(gcisID); summary.aa.dbT++; globalIdsT.add(gcisID); }
                    if (isProd) { summary.aa.idsP.add(gcisID); summary.aa.dbP++; globalIdsP.add(gcisID); }
                } else {
                    if (isTest) { summary.ap.idsT.add(gcisID); summary.ap.dbT++; globalIdsT.add(gcisID); }
                    if (isProd) { summary.ap.idsP.add(gcisID); summary.ap.dbP++; globalIdsP.add(gcisID); }
                }
            }

            const current = {
                aa_idT: summary.aa.idsT.size,
                aa_idP: summary.aa.idsP.size,
                aa_dbT: summary.aa.dbT / 2,
                aa_dbP: summary.aa.dbP / 2,
                aa_total: (summary.aa.dbT + summary.aa.dbP) / 2,
                ap_idT: summary.ap.idsT.size,
                ap_idP: summary.ap.idsP.size,
                ap_dbT: summary.ap.dbT,
                ap_dbP: summary.ap.dbP,
                ap_total: summary.ap.dbT + summary.ap.dbP,
                total_idT: globalIdsT.size,
                total_idP: globalIdsP.size,
                total_dbT: summary.aa.dbT / 2 + summary.ap.dbT,
                total_dbP: summary.aa.dbP / 2 + summary.ap.dbP,
                total_all: (summary.aa.dbT + summary.aa.dbP) / 2 + summary.ap.dbT + summary.ap.dbP
            };

            const last = loadLastSummary();

            const html = `
                <table>
                    <thead>
                        <tr>
                            <th colspan="2" rowspan="2">DBaaS Summary</th>
                            <th colspan="2">GCIS ID Count (Unique)</th>
                            <th colspan="3">DB Count (Instances)</th>
                            <th rowspan="2">Diff</th>
                        </tr>
                        <tr>
                            <th class="subheader">Testing</th>
                            <th class="subheader">Production</th>
                            <th class="subheader">Testing</th>
                            <th class="subheader">Production</th>
                            <th class="subheader">Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Active-Active</td>
                            <td>MariaDB</td>
                            <td>${current.aa_idT}</td>
                            <td>${current.aa_idP}</td>
                            <td>${current.aa_dbT}</td>
                            <td>${current.aa_dbP}</td>
                            <td>${current.aa_total}</td>
                            <td>${formatDiff(current.aa_total, last?.aa_total)}</td>
                        </tr>
                        <tr>
                            <td>Active-Passive</td>
                            <td>MariaDB</td>
                            <td>${current.ap_idT}</td>
                            <td>${current.ap_idP}</td>
                            <td>${current.ap_dbT}</td>
                            <td>${current.ap_dbP}</td>
                            <td>${current.ap_total}</td>
                            <td>${formatDiff(current.ap_total, last?.ap_total)}</td>
                        </tr>
                        <tr class="total-row">
                            <td colspan="2">Total (Global Unique ID)</td>
                            <td>${current.total_idT}</td>
                            <td>${current.total_idP}</td>
                            <td>${current.total_dbT}</td>
                            <td>${current.total_dbP}</td>
                            <td>${current.total_all}</td>
                            <td>${formatDiff(current.total_all, last?.total_all)}</td>
                        </tr>
                    </tbody>
                </table>
            `;

            document.getElementById('result').innerHTML = html;
            document.getElementById('dateText').textContent = new Date().toLocaleString('zh-HK');

            saveCurrentSummary(current);
        };
        reader.readAsArrayBuffer(file);
    });
</script>



</body>
</html>
