<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="IMG_3755.jpg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background: #f8fafc; }
        .list-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 8px rgba(0,0,0,.04); border: 1px solid #e2e8f0; }
        .inv-item { border-left: 4px solid #86efac; }
        .inv-item:hover { background: #f0fdf4; }
        .search-box { max-width: 280px; }
        .filter-select { max-width: 180px; }
    </style>
</head>
<body>

<div id="navbar-placeholder"></div>
<script src="./assets/js/navbar.js"></script>

<div class="container py-4">
    <div class="list-card p-4 mb-4">
        <h4 class="mb-1">Inventory List</h4>
        <p class="text-muted small mb-3">自動載入 Inventory.xlsx</p>

        <div class="d-flex gap-2 flex-wrap mb-3">
            <input type="text" id="searchInput" class="form-control form-control-sm search-box" placeholder="搜尋 VM / IP / Purpose...">

            <select id="envFilter" class="form-select form-select-sm filter-select">
                <option value="">全部環境</option>
                <option value="Testing">Testing</option>
                <option value="Production">Production</option>
            </select>

            <select id="groupFilter" class="form-select form-select-sm filter-select">
                <option value="">全部 Group</option>
                <option value="Group 1">Group 1</option>
                <option value="Group 2">Group 2</option>
                <option value="Group 3">Group 3</option>
                <option value="Group 4">Group 4</option>
                <option value="Group 5">Group 5</option>
                <option value="Group 6">Group 6</option>
                <option value="Group 7">Group 7</option>
                <option value="Group 8">Group 8</option>
            </select>

            <select id="purposeFilter" class="form-select form-select-sm filter-select">
                <option value="">全部 Purpose</option>
            </select>
        </div>

        <div id="stats" class="small text-muted mb-2">載入中...</div>
        <div id="invList" class="list-group"></div>
    </div>
</div>

<script src="assets/dist/js/bootstrap.bundle.min.js"></script>

<script>
let allRows = [];

async function autoLoad() {
    try {
        const res = await fetch('./Inventory.xlsx');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const buf = await res.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });

        allRows = [];

        wb.SheetNames.forEach(name => {
            const sheet = wb.Sheets[name];
            const json = XLSX.utils.sheet_to_json(sheet, { defval: '', header: 1 });

            let headerIdx = -1;
            for (let i = 0; i < Math.min(json.length, 15); i++) {
                const row = json[i] || [];
                if (row.some(c => String(c).includes('Purpose') || String(c).includes('VM'))) {
                    headerIdx = i;
                    break;
                }
            }
            if (headerIdx === -1) return;

            const headers = json[headerIdx].map(h => String(h || '').trim());
            const env = /prd|prod/i.test(name) ? 'Production' : 'Testing';

            for (let i = headerIdx + 1; i < json.length; i++) {
                const row = json[i] || [];
                if (!row.some(c => c)) continue;

                const obj = { Environment: env };
                headers.forEach((h, idx) => {
                    if (h) obj[h] = row[idx] !== undefined ? String(row[idx]) : '';
                });

                obj.Purpose = obj.Purpose || '';
                obj.VM = obj.VM || '';
                obj.IP = obj['IP Address (eth0)'] || '';
                obj.MgtIP = obj['IP Address (eth1) MGT NIC'] || '';
                obj.Group = obj['NSX-T T1 Gateway Group'] || '';
                obj.Site = obj.Site || '';

                if (obj.VM || obj.Purpose) allRows.push(obj);
            }
        });

        populatePurpose();
        document.getElementById('stats').textContent = `已自動載入 ${allRows.length} 筆`;
        renderList();
    } catch (e) {
        document.getElementById('stats').textContent = '載入失敗，請確認 Inventory.xlsx 在根目錄（需用 GitHub Pages 或本地伺服器開啟）';
        console.error(e);
    }
}

function populatePurpose() {
    const purposes = [...new Set(allRows.map(r => r.Purpose).filter(Boolean))].sort();
    const sel = document.getElementById('purposeFilter');
    sel.innerHTML = `<option value="">全部 Purpose</option>` +
        purposes.map(p => `<option value="${p}">${p}</option>`).join('');
}

function renderList() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const env = document.getElementById('envFilter').value;
    const group = document.getElementById('groupFilter').value;
    const purpose = document.getElementById('purposeFilter').value;

    const filtered = allRows.filter(r => {
        const text = `${r.Purpose} ${r.VM} ${r.IP} ${r.MgtIP} ${r.Site}`.toLowerCase();
        if (q && !text.includes(q)) return false;
        if (env && r.Environment !== env) return false;
        if (group && r.Group !== group) return false;
        if (purpose && r.Purpose !== purpose) return false;
        return true;
    });

    document.getElementById('stats').textContent = `顯示 ${filtered.length} 筆 / 總共 ${allRows.length} 筆`;

    const html = filtered.map(r => `
        <div class="list-group-item inv-item">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <strong>${r.VM || '-'}</strong>
                    <span class="text-muted"> · ${r.Purpose || '-'}</span>
                    <div class="small mt-1">
                        <span class="badge bg-secondary">${r.Environment}</span>
                        ${r.Site ? `<span class="badge bg-dark">${r.Site}</span>` : ''}
                        ${r.Group ? `<span class="badge bg-info text-dark">${r.Group}</span>` : ''}
                    </div>
                </div>
                <div class="text-end small">
                    <div>eth0: ${r.IP || '-'}</div>
                    <div>Mgt: ${r.MgtIP && r.MgtIP !== 'n/a' ? r.MgtIP : '-'}</div>
                </div>
            </div>
        </div>
    `).join('');

    document.getElementById('invList').innerHTML = html || '<div class="text-muted p-3">沒有符合的資料</div>';
}

['searchInput', 'envFilter', 'groupFilter', 'purposeFilter'].forEach(id => {
    document.getElementById(id).addEventListener('input', renderList);
    document.getElementById(id).addEventListener('change', renderList);
});


autoLoad();

</script>
</body>
</html>
