<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WARN Alerts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="IMG_3755.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #f8fafc; }
        .warn-card { border-left: 4px solid #f59e0b; }
        .severity-warn { background: #fef3c7; color: #92400e; }
        .status-open { background: #dbeafe; color: #1e40af; }
        .notes-box { background: #f8fafc; border-radius: 6px; }
    </style>
</head>
<body>

<div id="navbar-placeholder"></div>
<script src="./assets/js/navbar.js"></script>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">WARN Alerts</h4>
        <button class="btn btn-sm btn-outline-secondary" onclick="loadWarns()">重新載入</button>
    </div>

    <div class="d-flex gap-2 flex-wrap mb-3">
        <input type="text" id="searchInput" class="form-control form-control-sm" style="max-width:280px" placeholder="搜尋 INC / Host / Message...">
    </div>

    <div id="stats" class="small text-muted mb-2">載入中...</div>
    <div id="warnList" class="list-group"></div>
</div>

<script src="assets/dist/js/bootstrap.bundle.min.js"></script>
<script>
const SUPABASE_URL = "https://fyrzooerrrmkwrbjapoa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_YvzQbyBUN4ex7WLgLV5HFA_n2ctfmu0";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allWarns = [];

async function loadWarns() {
    const { data, error } = await supabaseClient
        .from('warns')
        .select('*')
        .order('occurred_at', { ascending: false });

    if (error) {
        document.getElementById('stats').textContent = '載入失敗：' + error.message;
        return;
    }
    allWarns = data || [];
    renderWarns();
}

function renderWarns() {
    const q = document.getElementById('searchInput').value.toLowerCase();

    const filtered = allWarns.filter(t => {
        const text = `${t.inc_number} ${t.hostname} ${t.message} ${t.title}`.toLowerCase();
        if (q && !text.includes(q)) return false;
        return true;
    });

    document.getElementById('stats').textContent = `顯示 ${filtered.length} 筆 / 總共 ${allWarns.length} 筆`;

    const html = filtered.map(t => {
        const time = t.occurred_at ? new Date(t.occurred_at).toLocaleString('zh-HK') : '-';
        return `
        <div class="list-group-item warn-card mb-2">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <strong>${t.inc_number || '-'}</strong>
                    <span class="badge severity-warn ms-2">WARN</span>
                    <span class="badge status-open">${t.status || '-'}</span>
                    <div class="small text-muted mt-1">${t.hostname || '-'}</div>
                    <div class="small mt-1">${t.object || ''}</div>
                </div>
                <div class="text-end small text-muted">${time}</div>
            </div>
            <div class="small mt-2 text-break">${t.message || ''}</div>
            <div class="notes-box p-2 mt-2">
                <div class="small text-muted mb-1">備註</div>
                <textarea class="form-control form-control-sm notes-input" rows="2" data-id="${t.id}">${t.notes || ''}</textarea>
                <button class="btn btn-sm btn-outline-primary mt-1 save-notes" data-id="${t.id}">儲存備註</button>
            </div>
        </div>`;
    }).join('');

    document.getElementById('warnList').innerHTML = html || '<div class="text-muted p-3">沒有符合的資料</div>';

    document.querySelectorAll('.save-notes').forEach(btn => {
        btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            const notes = document.querySelector(`.notes-input[data-id="${id}"]`).value;
            const { error } = await supabaseClient
                .from('warns')
                .update({ notes })
                .eq('id', id);
            if (error) alert(error.message);
            else {
                btn.textContent = '已儲存';
                setTimeout(() => btn.textContent = '儲存備註', 1500);
            }
        });
    });
}

document.getElementById('searchInput').addEventListener('input', renderWarns);
loadWarns();
</script>
</body>
</html>
