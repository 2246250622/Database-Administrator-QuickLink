<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WARN Alerts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="IMG_3755.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #7c3aed;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .page-header { margin-bottom: 20px; }
        .page-header h1 { font-size: 1.5rem; font-weight: 600; margin: 0; }
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
        .toolbar .form-control {
            border-radius: 8px;
            border-color: var(--border);
            font-size: 0.875rem;
        }
        .toolbar .form-control:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }
        .btn-soft {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.8rem;
            padding: 6px 12px;
        }
        .btn-soft:hover { background: #f8fafc; }
        .warn-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-left: 3px solid #f59e0b;
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 8px;
            transition: all 0.12s;
        }
        .warn-card:hover { border-color: #fcd34d; box-shadow: 0 4px 16px rgba(0,0,0,0.05); }
        .badge-warn { background: #fef3c7; color: #d97706; font-weight: 600; font-size: 0.7rem; padding: 2px 7px; border-radius: 5px; }
        .host-link { color: var(--muted); text-decoration: none; font-size: 0.85rem; }
        .host-link:hover { color: var(--accent); }
        .message-preview { color: var(--muted); font-size: 0.85rem; line-height: 1.5; margin-top: 6px; }
        .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
        .stats { color: var(--muted); font-size: 0.85rem; }
    </style>
</head>
<body>

<div id="navbar-placeholder"></div>
<script src="./assets/js/navbar.js"></script>

<div class="container py-4">
    <div class="page-header d-flex justify-content-between align-items-center">
        <h1>WARN Alerts</h1>
        <button class="btn-soft" onclick="loadWarns()">Refresh</button>
    </div>

    <div class="toolbar">
        <input type="text" id="searchInput" class="form-control form-control-sm" style="max-width:260px" placeholder="Search INC, host, message...">
        <span id="stats" class="stats ms-auto">Loading...</span>
    </div>

    <div id="warnList"></div>
</div>

<script src="assets/dist/js/bootstrap.bundle.min.js"></script>
<script>
const SUPABASE_URL = "https://fyrzooerrrmkwrbjapoa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_YvzQbyBUN4ex7WLgLV5HFA_n2ctfmu0";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allWarns = [];

function cleanHostname(host) {
    if (!host) return '-';
    return host
        .replace(/\.dbaas\.gcisdctr\.hksarg$/i, '')
        .replace(/\.mgt\.gcisdctr\.hksarg$/i, '')
        .replace(/\.dbaas\.gcis\.hksarg$/i, '')
        .replace(/\.mgt\.gcis\.hksarg$/i, '');
}

function formatTime(dt) {
    if (!dt) return '-';
    return new Date(dt).toLocaleString('zh-HK', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

async function loadWarns() {
    document.getElementById('stats').textContent = 'Loading...';
    const { data, error } = await supabaseClient.from('warns').select('*').order('occurred_at', { ascending: false });
    if (error) {
        document.getElementById('stats').textContent = 'Failed';
        return;
    }
    allWarns = data || [];
    renderWarns();
}

function renderWarns() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allWarns.filter(t => {
        const text = `${t.inc_number} ${t.hostname} ${t.message} ${t.title}`.toLowerCase();
        return !q || text.includes(q);
    });
    document.getElementById('stats').textContent = `${filtered.length} / ${allWarns.length}`;
    if (filtered.length === 0) {
        document.getElementById('warnList').innerHTML = '<div class="empty-state"><div class="fs-1 mb-2">⚠️</div><div>No matching alerts</div></div>';
        return;
    }
    document.getElementById('warnList').innerHTML = filtered.map(t => {
        const time = formatTime(t.occurred_at);
        const cleanHost = cleanHostname(t.hostname);
        return `
        <div class="warn-card">
            <div class="d-flex justify-content-between align-items-start">
                <div class="d-flex align-items-center gap-2">
                    <strong>${t.inc_number || '-'}</strong>
                    <span class="badge-warn">WARN</span>
                </div>
                <small class="text-muted">${time}</small>
            </div>
            <div class="mt-2">
                <a href="dbaas_list.html?host=${encodeURIComponent(cleanHost)}" class="host-link">${cleanHost}</a>
            </div>
            <div class="message-preview">${t.message || ''}</div>
        </div>`;
    }).join('');
}

document.getElementById('searchInput').addEventListener('input', renderWarns);
loadWarns();
setInterval(loadWarns, 30000);
</script>
</body>
</html>
