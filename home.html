<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="IMG_3755.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root, [data-theme="light"] {
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #7c3aed;
        }
        [data-theme="dark"] {
            --bg: #0f1117;
            --card: #181b23;
            --border: #2a2e3a;
            --text: #e8eaed;
            --muted: #8b93a7;
            --accent: #a78bfa;
        }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; transition: background 0.2s, color 0.2s; }
        .page-header { margin-bottom: 28px; }
        .page-header h1 { font-size: 1.6rem; font-weight: 600; margin: 0; }
        .page-header p { color: var(--muted); margin: 4px 0 0; font-size: 0.9rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 32px; }
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px 22px;
            transition: box-shadow 0.15s;
        }
        .stat-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .stat-label { color: var(--muted); font-size: 0.8rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; }
        .stat-value { font-size: 2rem; font-weight: 700; margin-top: 4px; line-height: 1.2; }
        .stat-open .stat-value { color: #2563eb; }
        .stat-critical .stat-value { color: #dc2626; }
        .stat-warn .stat-value { color: #d97706; }
        .section-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 14px; }
        .incident-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 8px;
            display: block;
            text-decoration: none;
            color: inherit;
            transition: all 0.12s;
        }
        .incident-item:hover { border-color: #c4b5fd; }
        .incident-item strong { font-weight: 600; }
        .badge-critical { background: #fef2f2; color: #dc2626; font-weight: 600; font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; }
        .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
    </style>
</head>
<body>

<div id="navbar-placeholder"></div>
<script src="./assets/js/navbar.js"></script>

<div class="container py-4">
    <div class="page-header">
        <h1 data-i18n="dash.title">Dashboard</h1>
        <p data-i18n="dash.subtitle">Today's overview</p>
    </div>

    <div class="stat-grid">
        <div class="stat-card stat-open">
            <div class="stat-label" data-i18n="dash.open">Open Incidents</div>
            <div class="stat-value" id="openCount">-</div>
        </div>
        <div class="stat-card stat-critical">
            <div class="stat-label" data-i18n="dash.critical">Critical (Today)</div>
            <div class="stat-value" id="criticalCount">-</div>
        </div>
        <div class="stat-card stat-warn">
            <div class="stat-label" data-i18n="dash.warn">Warnings (Today)</div>
            <div class="stat-value" id="warnCount">-</div>
        </div>
    </div>

    <div class="section-title" data-i18n="dash.latest">Latest Incidents</div>
    <div id="recentList"></div>
</div>

<script src="assets/dist/js/bootstrap.bundle.min.js"></script>
<script>
const SUPABASE_URL = "https://fyrzooerrrmkwrbjapoa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_YvzQbyBUN4ex7WLgLV5HFA_n2ctfmu0";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadDashboard() {
    const today = new Date().toISOString().split('T')[0];
    const { data: tickets } = await supabaseClient.from('tickets').select('*').gte('created_at', today).order('occurred_at', { ascending: false });
    const { data: warns } = await supabaseClient.from('warns').select('*').gte('created_at', today);

    document.getElementById('openCount').textContent = (tickets || []).filter(t => t.status === 'OPEN').length;
    document.getElementById('criticalCount').textContent = (tickets || []).length;
    document.getElementById('warnCount').textContent = (warns || []).length;

    const recent = (tickets || []).slice(0, 5);
    const emptyText = document.documentElement.lang.startsWith("zh") ? "今日無事件" : "No incidents today";
    if (recent.length === 0) {
        document.getElementById('recentList').innerHTML = `<div class="empty">${emptyText}</div>`;
        return;
    }
    document.getElementById('recentList').innerHTML = recent.map(t => `
        <a href="tickets.html" class="incident-item">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <strong>${t.inc_number || '-'}</strong>
                    <span class="badge-critical ms-2">${t.severity || 'CRITICAL'}</span>
                    <div class="small text-muted mt-1">${t.hostname || '-'}</div>
                </div>
                <small class="text-muted">${t.occurred_at ? new Date(t.occurred_at).toLocaleTimeString(document.documentElement.lang, {hour:'2-digit', minute:'2-digit'}) : ''}</small>
            </div>
            <div class="small text-muted mt-2">${(t.message || '').slice(0, 100)}</div>
        </a>
    `).join('');
}

loadDashboard();
setInterval(loadDashboard, 30000);
</script>
</body>
</html>
