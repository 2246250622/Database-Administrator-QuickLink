<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="IMG_3755.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #f8fafc; }
        .stat-card { border-radius: 12px; }
        .stat-open { background: #dbeafe; }
        .stat-critical { background: #fee2e2; }
        .stat-warn { background: #fef3c7; }
    </style>
</head>
<body>

<div id="navbar-placeholder"></div>
<script src="./assets/js/navbar.js"></script>

<div class="container py-4">
    <h4 class="mb-4">Dashboard</h4>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card stat-card stat-open p-3">
                <div class="text-muted small">Opening Ticket</div>
                <div class="fs-2 fw-bold" id="openCount">-</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card stat-critical p-3">
                <div class="text-muted small">Today ERROR</div>
                <div class="fs-2 fw-bold" id="criticalCount">-</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card stat-warn p-3">
                <div class="text-muted small">Today WARN</div>
                <div class="fs-2 fw-bold" id="warnCount">-</div>
            </div>
        </div>
    </div>

    <h5 class="mb-3">Latest CRITICAL</h5>
    <div id="recentList" class="list-group"></div>
</div>

<script src="assets/dist/js/bootstrap.bundle.min.js"></script>
<script>
const SUPABASE_URL = "https://fyrzooerrrmkwrbjapoa.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_YvzQbyBUN4ex7WLgLV5HFA_n2ctfmu0";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadDashboard() {
    const today = new Date().toISOString().split('T')[0];

    const { data: tickets } = await supabaseClient
        .from('tickets')
        .select('*')
        .gte('created_at', today)
        .order('occurred_at', { ascending: false });

    const { data: warns } = await supabaseClient
        .from('warns')
        .select('*')
        .gte('created_at', today);

    const openCount = (tickets || []).filter(t => t.status === 'OPEN').length;
    const criticalCount = (tickets || []).length;
    const warnCount = (warns || []).length;

    document.getElementById('openCount').textContent = openCount;
    document.getElementById('criticalCount').textContent = criticalCount;
    document.getElementById('warnCount').textContent = warnCount;

    const recent = (tickets || []).slice(0, 5);
    const html = recent.map(t => `
        <a href="tickets.html" class="list-group-item list-group-item-action">
            <strong>${t.inc_number}</strong>
            <span class="badge bg-danger ms-2">${t.severity}</span>
            <div class="small text-muted">${t.hostname}</div>
            <div class="small">${t.message?.slice(0, 80) || ''}</div>
        </a>
    `).join('');
    document.getElementById('recentList').innerHTML = html || '<div class="text-muted p-3">今日無 CRITICAL</div>';
}

loadDashboard();
setInterval(loadDashboard, 60000);
</script>
</body>
</html>
